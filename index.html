<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#17140f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سعراتي">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سعراتي</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
html{background:var(--bg)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root,[data-mode="dark"]{--bg:#17140f;--card:#1f1a14;--tx:#f3ecdc;--mu:#8a7f6e;--tr:#2e2820;--wd:#352e25;--tk:#2a2520;--bl:#e8856c;--ye:#f6b73c;--rd:#b79cf0;--cr:#f6b73c;--wt:#5fa8c4;--rbg:#3a1c18;--rtx:#ff8a7a;--sh:rgba(0,0,0,.5);--rf:grayscale(1) brightness(2);color-scheme:dark}
[data-mode="light"]{--bg:#f7f1e6;--card:#fffaf0;--tx:#2b2418;--mu:#8a7d66;--tr:#e6dcc8;--wd:#efe6d3;--tk:#ebe1cd;--bl:#d4604a;--ye:#d9930a;--rd:#7c5cd6;--cr:#d9930a;--wt:#3a8fb0;--rbg:#fde4df;--rtx:#c0392b;--sh:rgba(80,60,20,.18);--rf:grayscale(1) brightness(.5);color-scheme:light}
:root{--or:#f6b73c;--or2:#ee9a1f;--on:#1d1405}
[data-accent="mint"]{--or:#34d399;--or2:#1fb37a;--on:#04130c}
[data-accent="ocean"]{--or:#5aa9ff;--or2:#3b82f6;--on:#04101f}
[data-accent="rose"]{--or:#ff6b9a;--or2:#e0457b;--on:#2a0612}
[data-accent="violet"]{--or:#a78bfa;--or2:#8b5cf6;--on:#12082e}
[data-mode="dark"][data-accent="mono"]{--or:#f3f3f3;--or2:#cfcfcf;--on:#000}
[data-mode="light"][data-accent="mono"]{--or:#2b2b2b;--or2:#000;--on:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif}
.app{max-width:480px;margin:auto;padding:14px 16px 130px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.top small{color:var(--mu);font-size:14px}
.ctl{display:flex;gap:8px}
.cb{height:46px;border-radius:99px;background:var(--card);border:1px solid var(--tr);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;padding:0;min-width:46px;cursor:pointer}
.cb.w{padding:0 8px 0 14px;color:var(--mu);direction:ltr}
.cb.w i{width:32px;height:32px;border-radius:50%;background:var(--wd);display:flex;align-items:center;justify-content:center;color:var(--tx);font-style:normal}
.week{display:flex;gap:8px;margin-bottom:22px;padding:3px}
.wd{flex:1;aspect-ratio:1;border:0;background:none;padding:0;position:relative;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;border-radius:50%}
.wd svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.wd span{position:relative}
.wd.sel{outline:2px solid var(--tx);outline-offset:3px}
.card{background:var(--card);border-radius:28px;padding:20px;margin-bottom:14px}
.big{display:flex;align-items:center;justify-content:space-between;min-height:150px}
.big .n{font-size:68px;font-weight:800;line-height:1}
.big .s{color:var(--mu);font-size:17px;margin-top:10px;cursor:pointer}
.ring{position:relative;width:140px;height:140px;flex:none}
.ring svg{width:100%;height:100%;transform:scaleX(-1) rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;filter:var(--rf)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.mc{background:var(--card);border-radius:22px;padding:14px}
.mc small{color:var(--mu);font-size:14px}
.mc div{display:flex;align-items:baseline;gap:4px;margin:2px 0 8px}
.mc b{font-size:28px;font-weight:800}
.mc span{color:var(--mu);font-size:12px;direction:ltr}
.tk{height:6px;background:var(--tk);border-radius:9px;overflow:hidden}
.tk i{display:block;height:100%;border-radius:9px}
.dv{display:flex;align-items:center;gap:14px;color:var(--mu);margin:6px 4px 16px}
.dv:before,.dv:after{content:"";flex:1;height:1px;background:var(--tr)}
.meal{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:26px;padding:16px;margin-bottom:12px;cursor:pointer}
.me{font-size:44px;width:56px;text-align:center;flex:none}
.mb{flex:1;min-width:0}
.mt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mt b{font-size:19px;font-weight:600;line-height:1.4}
.mt small{color:var(--mu);font-size:12px;white-space:nowrap;margin-top:4px}
.mm{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:15px;flex-wrap:wrap}
.mm .k{color:var(--mu);font-size:13px}.mm .k b{color:var(--tx);font-size:18px;font-weight:800}
.mm .sp{width:1px;height:22px;background:var(--wd)}
.mm em{font-style:normal;direction:ltr;font-weight:600}
.mm em:before{content:"●";margin-inline-end:5px;font-size:11px;color:var(--c)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.bar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:0 16px;display:flex;gap:12px;z-index:5}
.nav{flex:1;display:flex;background:var(--card);border:1px solid var(--tr);border-radius:40px;padding:6px;gap:4px;box-shadow:0 8px 30px var(--sh)}
.nav button{flex:1;border:0;background:none;color:var(--tx);font:inherit;font-size:12px;border-radius:30px;padding:8px 0;cursor:pointer}
.nav button span{display:block;font-size:22px;line-height:1.2}
.nav button.on{background:var(--wd);color:var(--or)}
.fab{width:76px;height:76px;flex:none;border-radius:50%;border:0;background:var(--or);color:var(--on);font-size:44px;font-weight:300;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);box-shadow:0 8px 24px color-mix(in srgb,var(--or) 40%,transparent)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0;font-size:19px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{border:0;background:none;color:var(--mu);font-size:28px;cursor:pointer}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--tr);border-radius:16px;padding:12px;margin:4px 0}
textarea{min-height:96px;resize:none}
label{font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;background:var(--or);color:var(--on);font:inherit;font-weight:600;border-radius:16px;padding:13px;cursor:pointer;width:100%;margin-top:6px}
.btn.sec{background:var(--wd)}.btn.red{background:var(--rbg);color:var(--rtx)}
.btn:disabled{opacity:.5}
.mu{color:var(--mu);font-size:13px}.er{color:var(--rtx);font-size:14px}
.sub{border:1px solid var(--tr);border-radius:18px;padding:10px;margin:8px 0}
.msg{padding:10px 14px;border-radius:20px;margin:6px 0;max-width:86%;white-space:pre-wrap;font-size:15px;line-height:1.7}
.msg.u{background:var(--or);color:var(--on);margin-inline-start:auto}
.msg.a{background:var(--card)}
.ci{display:flex;gap:6px;margin-top:10px}.ci input{margin:0}.ci button{width:auto;padding:0 18px;margin:0}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20}

/* settings */
.stp{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sth{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,calc((100% - 480px)/2)) 10px;background:var(--bg);background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.sth h1{margin:0;font-size:18px;font-weight:700;text-align:center}
.stc{width:46px;height:46px;border-radius:50%;border:1px solid var(--tr);background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.stin{max-width:480px;margin:0 auto;padding:6px 16px calc(48px + env(safe-area-inset-bottom,0px))}
.sthero{background:var(--card);border-radius:30px;padding:22px 20px;text-align:center;margin:10px 0 6px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;font-size:34px;font-weight:800;line-height:1.2}
.lg{width:58px;height:58px;border-radius:17px;background:var(--tk);border:1px solid var(--wd);display:flex;align-items:center;justify-content:center}
.sthero p{margin:12px 0 12px;font-size:17px;line-height:1.7}
.mcs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.mcs span{display:flex;align-items:center;gap:5px;background:var(--wd);border-radius:99px;padding:5px 9px;font-size:13px;white-space:nowrap}
.mcs .dt{width:10px;height:10px}
.stb{border:0;background:var(--or);color:var(--on);font:inherit;font-weight:700;font-size:17px;border-radius:99px;padding:12px 34px;cursor:pointer}
.stb.full{display:block;width:100%;border-radius:20px;margin-top:18px;padding:14px}
.sts{font-size:18px;font-weight:700;color:var(--mu);margin:28px 10px 10px}
.stg{background:var(--card);border-radius:28px;overflow:hidden}
.stn{color:var(--mu);font-size:13px;line-height:1.8;margin:8px 14px 0}
.rw{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:0 18px;background:none;border:0;color:var(--tx);font:inherit;font-size:17px;text-align:start;cursor:pointer}
button.rw:active,label.rw:active{background:var(--wd)}
.rw+.rw::before{content:"";position:absolute;top:0;inset-inline:64px 18px;height:1px;background:var(--wd)}
.rw+.rw.ni::before{inset-inline-start:18px}
.ri{width:28px;height:28px;flex:none;color:var(--or);display:flex;align-items:center;justify-content:center}
.rl{flex:1;min-width:0}
.rv{color:var(--mu);font-size:16px}
.rv.ac{color:var(--or);display:flex;align-items:center;gap:6px;font-weight:600}
.chv{color:var(--mu);flex:none}
.dt{width:14px;height:14px;border-radius:50%;display:block}
.nm{font-size:16px;font-weight:800}
.rw.red{color:var(--rtx)}
.ovs{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.fi{width:96px;margin:0;padding:8px 10px;background:var(--wd);border:0;border-radius:12px;font-size:17px;font-weight:700;text-align:center;color:var(--tx)}
.fi.lg2{width:58%;font-weight:500;text-align:start}
.fu{color:var(--mu);font-size:14px;min-width:34px}
.sw{direction:ltr;width:56px;height:34px;border-radius:99px;background:var(--wd);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--or)}.sw.on i{left:25px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tc{border:0;background:none;color:var(--tx);font:inherit;font-size:15px;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:center}
.tc.wide{width:100%;margin-top:8px}
.tp{height:92px;border-radius:18px;background:var(--bg);border:1px solid color-mix(in srgb,var(--mu) 35%,transparent);padding:10px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.tp.auto{background:linear-gradient(105deg,#000 50%,#f2f2f7 50%);height:54px}
.tpc{background:var(--card);border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:6px}
.tpc i{display:block;height:8px;width:55%;border-radius:9px;background:var(--or)}
.tpc b{display:block;height:6px;width:32%;border-radius:9px;background:var(--mu)}
.tpd{display:flex;gap:6px;padding-inline-start:4px}
.tpd u{width:14px;height:6px;border-radius:9px;display:block}
.tc.sel .tp{outline:2.5px solid var(--or);outline-offset:2px}
.tc.sel span::after{content:" ✓";color:var(--or);font-weight:800}
.rw:focus-visible,.stc:focus-visible,.stb:focus-visible,.tc:focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* v3 */
body{font-family:'Rubik','Cairo',system-ui,sans-serif}
.pg.in,.stin.in{animation:pgIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes pgIn{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes dn{to{transform:translateY(100%)}}
@keyframes fi{from{opacity:0}}
@keyframes fo{to{opacity:0}}
.stp.op{animation:up .45s cubic-bezier(.2,.8,.2,1)}.stp.out{animation:dn .28s ease-in forwards}
.ov.op{animation:fi .25s}.ov.op .sheet{animation:up .4s cubic-bezier(.2,.8,.2,1)}
.ov.cl{animation:fo .22s forwards}.ov.cl .sheet{animation:dn .22s ease-in forwards}
[data-a]{transition:width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1),stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
[data-a=d][data-to="0"]{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top2{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 4px 20px}
.top2 small{color:var(--mu);font-size:15px}.top2 h1{margin:2px 0 0;font-size:42px;font-weight:800;line-height:1.15}
.pill{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--tr);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
.pill svg{color:var(--or)}
.wk{display:flex;gap:6px;margin-bottom:22px}
.d{flex:1;border:0;background:none;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;cursor:pointer}
.d small{font-size:11px;color:var(--mu)}.d.sel small{color:var(--or)}
.dc{position:relative;width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.dc svg{position:absolute;inset:0;transform:rotate(-90deg)}.dc circle{fill:none;stroke:var(--tr);stroke-width:2.5}
.dc .pr{stroke:var(--or);stroke-width:3.5;stroke-linecap:round}
.dc b{position:relative;font-size:17px;font-weight:600}
.d.fu .dc b{color:var(--mu);opacity:.6}.d.fu circle:first-child{stroke-dasharray:3 6}
.d.sel .dc b{color:var(--or)}.d.sel .dc::after{content:"";position:absolute;inset:-5px;border:2.5px solid var(--or);border-radius:50%}
.card2{position:relative;background:var(--card);border:1px solid var(--tr);border-radius:38px;padding:20px 20px 22px;margin-bottom:14px}
.rng{position:relative;width:250px;height:250px;margin:14px auto 6px}
.rng svg{width:100%;height:100%;transform:scaleX(-1) rotate(-90deg)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid b{font-size:58px;font-weight:700;line-height:1}.mid span{color:var(--mu);margin-top:10px}
.sk{position:absolute;top:-18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,var(--or),var(--or2));color:var(--on);font-weight:800;border-radius:99px;padding:6px 16px;box-shadow:0 0 22px color-mix(in srgb,var(--or) 45%,transparent)}
.wtr{position:absolute;left:22px;top:18px;width:70px;text-align:center}
.wtr small{color:var(--wt);font-size:13px}.wtr b{display:block;font-size:19px;margin-top:8px}.wtr em{display:block;font-style:normal;color:var(--mu);font-size:12px;border-top:1px solid var(--tr);margin:2px 14px 10px;padding-top:2px}
.wbar{position:relative;height:120px;border-radius:99px;background:var(--tk);overflow:hidden;margin-top:8px}
.wbar i{position:absolute;bottom:0;left:0;right:0;background:var(--wt)}
.wb{display:flex;gap:6px;justify-content:center}.wb button{width:32px;height:32px;border-radius:11px;border:0;font-size:20px;cursor:pointer;background:var(--wt);color:#fff;padding:0}.wb .wm{background:var(--tk);color:var(--mu)}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.mh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.mh em{font-style:normal;color:var(--mu)}
.mx .tk{height:8px;background:var(--tk)}
.empty2{text-align:center;padding:26px 20px}.empty2 .ic{width:60px;height:60px;border-radius:50%;background:var(--tk);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:var(--or)}
.empty2 h3{margin:0 0 6px;font-size:20px}.empty2 p{margin:0 0 16px;color:var(--mu);line-height:1.7}
.go{border:0;font:inherit;font-weight:700;font-size:17px;color:var(--on);background:linear-gradient(180deg,var(--or),var(--or2));border-radius:99px;padding:13px 30px;display:inline-flex;gap:10px;align-items:center;cursor:pointer}
.man{width:100%;border:2px dashed var(--tr);background:none;color:var(--or);font:inherit;font-weight:600;font-size:19px;border-radius:32px;padding:30px 0;display:flex;gap:12px;justify-content:center;align-items:center;cursor:pointer;margin-bottom:14px}
.meal,.card{border:1px solid var(--tr)}
.bar2{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:flex-end;background:var(--bg);border-top:1px solid var(--tr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.bar2 .tb,.bar2 .gap{flex:1}.tb{border:0;background:none;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer;transition:color .2s,transform .15s}
.tb:active{transform:scale(.9)}.tb.on{color:var(--or)}
.fab2{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--or),var(--or2));color:var(--on);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 9px var(--bg),0 8px 26px color-mix(in srgb,var(--or) 45%,transparent);transition:transform .15s}
.fab2:active{transform:translateX(-50%) scale(.92)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:22px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;right:4px;width:calc((100% - 8px)/3);border-radius:18px;background:var(--wd);transform:translateX(calc(var(--i)*-100%));transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.seg button{position:relative;border:0;background:none;color:var(--mu);font:inherit;font-size:16px;padding:13px 0;cursor:pointer;transition:color .2s}.seg button.on{color:var(--tx);font-weight:600}

/* v4 */
.card2{padding:16px 18px 18px}
.rng{width:164px;height:164px;margin:22px auto 8px}
.mid b{font-size:38px}.mid span{font-size:13px;margin-top:6px}
.sk{top:-14px;padding:4px 13px;font-size:14px}
.wtr{width:44px;left:18px;top:14px}.wtr small{font-size:12px}
.wbar{width:26px;height:82px;margin:6px auto 0}
.wtr b{font-size:15px;margin-top:6px}.wtr em{font-size:11px;margin:2px 4px 6px}
.wb{flex-direction:column;align-items:center;gap:4px}.wb button{width:26px;height:26px;font-size:17px;border-radius:9px}
.wb button:active{animation:bump .3s}@keyframes bump{50%{transform:scale(1.3)}}
.mx{margin-top:12px}
.sheet{background:var(--bg);border-top:1px solid var(--tr);border-radius:34px 34px 0 0;padding-top:10px}
.hnd{display:block;position:relative;width:44px;height:5px;border-radius:9px;background:var(--wd);margin:0 auto 18px}
.hnd::before{content:"";position:absolute;inset:-16px -40px}
.sh2{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.sheet .sh2 h2{font-size:30px;font-weight:800;margin:0}.sh2 p{margin:4px 0 0;color:var(--mu)}
.pe{width:54px;height:54px;border-radius:17px;border:1px solid var(--tr);color:var(--or);display:flex;align-items:center;justify-content:center;flex:none}
.sheet textarea{background:var(--card);border-radius:26px;padding:18px;min-height:130px;font-size:18px;border:1px solid var(--tr)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}.chips button{border:1px solid var(--tr);background:none;color:var(--mu);font:inherit;font-size:14px;border-radius:99px;padding:7px 14px;cursor:pointer}
.cbtn{width:100%;border:1px solid var(--tr);background:var(--card);color:var(--tx);font:inherit;font-size:18px;border-radius:24px;padding:17px;display:flex;gap:12px;justify-content:center;align-items:center;cursor:pointer}.cbtn svg{color:var(--or)}
.go2{width:100%;border:0;font:inherit;font-weight:800;font-size:20px;color:var(--on);background:linear-gradient(180deg,var(--or),var(--or2));border-radius:99px;padding:19px;margin-top:16px;cursor:pointer;transition:opacity .25s,transform .15s}
.go2.dim{opacity:.45}.go2:active{transform:scale(.98)}
.go2:disabled{background:linear-gradient(110deg,var(--or) 30%,var(--or2) 50%,var(--or) 70%);background-size:220% 100%;animation:shm 1.2s linear infinite}
@keyframes shm{to{background-position:-220% 0}}
.lnk{display:block;margin:14px auto 0;border:0;background:none;color:var(--mu);font:inherit;text-decoration:underline;cursor:pointer}
.wtr{width:66px}.wrow{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:6px}.wrow .wbar{margin:0}

/* v5: app feel + motion */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}}
.pg.in>*,.stin.in>*,.ov.op .sheet>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.pg.in>*:nth-child(2),.stin.in>*:nth-child(2),.ov.op .sheet>*:nth-child(2){animation-delay:0.05s}
.pg.in>*:nth-child(3),.stin.in>*:nth-child(3),.ov.op .sheet>*:nth-child(3){animation-delay:0.10s}
.pg.in>*:nth-child(4),.stin.in>*:nth-child(4),.ov.op .sheet>*:nth-child(4){animation-delay:0.15s}
.pg.in>*:nth-child(5),.stin.in>*:nth-child(5),.ov.op .sheet>*:nth-child(5){animation-delay:0.20s}
.pg.in>*:nth-child(6),.stin.in>*:nth-child(6),.ov.op .sheet>*:nth-child(6){animation-delay:0.25s}
.pg.in>*:nth-child(7),.stin.in>*:nth-child(7),.ov.op .sheet>*:nth-child(7){animation-delay:0.30s}
.pg.in>*:nth-child(8),.stin.in>*:nth-child(8),.ov.op .sheet>*:nth-child(8){animation-delay:0.35s}
.tb.on svg{animation:pop .35s}
.toast{animation:toastIn .35s cubic-bezier(.2,.8,.2,1)}
.meal,.d,.man,.pill,.go,.cbtn,.stb,.go2,.rw,.tc{transition:transform .15s,background .2s}
.meal:active,.d:active,.man:active,.pill:active,.go:active,.cbtn:active,.stb:active,.tc:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="set"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden onchange="snapped(this)">
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ar=s=>!S.ard?String(s):String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g,'٫');
const K='sa3rati_v1';
const DEF={sex:'m',age:25,h:170,w:70,act:1.375,goal:0,kcal:2200,p:165,c:275,f:49};
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{};S.logs=S.logs||{};S.weights=S.weights||[];S.profile=S.profile||{...DEF};S.key=/^gsk_/.test(S.key||'')?S.key:'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';S.water=S.water||{};S.unit=S.unit||'kg';S.model=(S.model&&!/gemini/.test(S.model)&&S.model!=='llama-3.3-70b-versatile')?S.model:'auto';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const LOC=()=>S.ard?'ar-EG':'ar-EG-u-nu-latn';
const wu=()=>S.unit==='lb'?'lb':'كجم',wv=kg=>S.unit==='lb'?kg*2.20462:kg,wk=v=>S.unit==='lb'?v/2.20462:v,fw=kg=>ar(+wv(kg).toFixed(1));
const AC={amber:['عنبري','#f6b73c'],mint:['نعناع','#34d399'],ocean:['محيط','#5aa9ff'],rose:['وردي','#ff6b9a'],violet:['بنفسجي','#a78bfa'],mono:['أحادي','#e8e8e8']};
const mq=matchMedia('(prefers-color-scheme: dark)'),RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches,fmt=n=>Number(n).toLocaleString(S.ard?'ar-EG':'en-US');
if(!S.mode){const o=S.theme,M={orange:'amber',sunset:'rose',day:'amber',sage:'mint',auto:'amber'};S.accent=AC[o]?o:(M[o]||'amber');S.mode=!o?'dark':({day:1,sage:1,rose:1}[o]?'light':(o==='auto'?'auto':'dark'))}
function applyTheme(){const d=document.documentElement;d.dataset.mode=S.mode==='auto'?(mq.matches?'dark':'light'):S.mode;d.dataset.accent=AC[S.accent]?S.accent:'amber';const x=document.querySelector('meta[name=theme-color]');if(x)x.content=getComputedStyle(d).getPropertyValue('--bg').trim()||'#000'}
if(mq.addEventListener)mq.addEventListener('change',()=>{if(S.mode==='auto')applyTheme()});
applyTheme();
const dk=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const pd=k=>{const[a,b,c]=k.split('-');return new Date(+a,+b-1,+c)};
const today=dk(new Date());
let cur=today,tab='home',AI=null,chat=[],imgOK=false;
(async()=>{try{if(window.claude){AI=await claude.use('sample');try{imgOK=!!(await AI.limits()).images}catch(e){}}}catch(e){AI=null}setTimeout(render)})();
const norm=o=>({name:String(o.name||'وجبة'),emoji:o.emoji||'🍽️',kcal:Math.round(+o.kcal||0),p:Math.round(+o.p||0),c:Math.round(+o.c||0),f:Math.round(+o.f||0)});
const day=d=>S.logs[d]||[];
const tot=d=>day(d).reduce((a,i)=>({k:a.k+i.kcal,p:a.p+i.p,c:a.c+i.c,f:a.f+i.f}),{k:0,p:0,c:0,f:0});
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
function streak(){let n=0,d=new Date();if(!day(dk(d)).length)d.setDate(d.getDate()-1);while(day(dk(d)).length){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- AI: Groq (if key) else built-in ---------- */
const PREF=['openai/gpt-oss-120b','llama-3.3-70b-versatile','openai/gpt-oss-20b','llama-3.1-8b-instant'],VPREF=['meta-llama/llama-4-scout-17b-16e-instruct','meta-llama/llama-4-maverick-17b-128e-instruct'];
let AV=null;
async function avail(){
  if(AV)return AV;
  const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+S.key}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error('Groq ('+r.status+'): '+((j.error&&j.error.message)||'خطأ'));
  return AV=(j.data||[]).map(m=>m.id);
}
async function pickModel(vis){
  const a=await avail(),bad=/guard|whisper|tts|compound|embed|orpheus|distil/;
  const c=vis?VPREF:[...(S.model&&S.model!=='auto'?[S.model]:[]),...PREF];
  const m=c.find(x=>a.includes(x))||a.find(x=>!bad.test(x)&&(vis?/llama-4|vision|scout|maverick/.test(x):/gpt-oss|llama|qwen|kimi/.test(x)));
  if(!m)throw new Error((vis?'مفيش موديل بيقرا الصور على حسابك':'مفيش موديل نصي متاح على حسابك')+' — المتاح: '+a.slice(0,10).join(', '));
  return m;
}
async function gem(contents,json){
  let vis=false;
  const messages=contents.map(c=>{
    const tx=c.parts.filter(x=>x.text!=null).map(x=>x.text).join('\n'),im=c.parts.filter(x=>x.inlineData);
    if(im.length){vis=true;return{role:'user',content:[{type:'text',text:tx},...im.map(x=>({type:'image_url',image_url:{url:'data:'+x.inlineData.mimeType+';base64,'+x.inlineData.data}}))]}}
    return{role:c.role==='model'?'assistant':'user',content:tx};
  });
  const model=await pickModel(vis);
  const body={model,messages,temperature:json?0:.5,max_tokens:4000};
  if(/gpt-oss/.test(model))body.reasoning_effort='low';
  if(json&&!vis)body.response_format={type:'json_object'};
  let last=new Error('Groq');
  for(let a=0;a<3;a++){
    let fatal=false;
    try{
      const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key},body:JSON.stringify(body)});
      const j=await r.json();
      if(r.ok){
        let t=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
        if(json){const i=t.indexOf('{'),k=t.lastIndexOf('}');if(i>=0&&k>i)t=t.slice(i,k+1)}
        if(t)return t;last=new Error('رد فاضي من Groq ('+model+')');
      }else{last=new Error('Groq ('+r.status+', '+model+'): '+((j.error&&j.error.message)||'خطأ'));fatal=![429,500,503].includes(r.status)}
    }catch(e){last=e}
    if(fatal)break;
    await new Promise(z=>setTimeout(z,1200*(a+1)));
  }
  throw last;
}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function anth(messages){try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages})});const j=await r.json();if(!r.ok)throw 0;return(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('')}catch(e){throw new Error('no-ai')}}
async function anthJSON(q,img){const c=[{type:'text',text:q}];if(img)c.unshift({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await b64(img)}});const t=await anth([{role:'user',content:c}]),i=t.indexOf('{'),k=t.lastIndexOf('}');return JSON.parse(t.slice(i,k+1))}
async function askJSON(q,img){
  if(S.key){try{const parts=[{text:q}];if(img)parts.push({inlineData:{mimeType:'image/jpeg',data:await b64(img)}});return JSON.parse((await gem([{role:'user',parts}],true)).replace(/```json|```/g,'').trim())}catch(e){if(!AI)throw e}}
  if(AI)return AI.json(q,img?{cache:false,images:[img]}:{cache:false});
  return anthJSON(q,img);
}
async function askChat(msgs,on){
  if(S.key){try{const t=await gem(msgs.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]})));on(t);return t}catch(e){if(!AI)throw e}}
  if(AI){const r=await AI(msgs,{cache:false,onText:({text})=>on(text)});return r.text}
  const t=await anth(msgs.map(m=>({role:m.role==='user'?'user':'assistant',content:m.content})));on(t);return t;
}

/* ---------- render ---------- */
const SI=(p,w=24)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={home:SI('<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>'),trend:SI('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'),chat:SI('<path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/>'),user:SI('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>'),cam:SI('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.8"/>',32),edit:SI('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),flame:SI('<path d="M12 3c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="currentColor"/>',16),scale:SI('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9a6 6 0 018 0"/>',18)};
I.cam2=SI('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.8"/>',22);
const TB=['home','progress','coach'],L=['ح','ن','ث','ر','خ','ج','س'];
let enter=0;const AN={};let anDay=null;
function render(){
  const A=$('#app'),c=tab==='home'?home():tab==='progress'?progress():coachV();
  const T=(k,ic,l)=>`<button class="tb ${tab===k?'on':''}" onclick="go('${k}')">${ic}<span>${l}</span></button>`;
  A.innerHTML=`<div class="pg ${enter?'in':''}" style="--dx:${enter}px">${c}</div><nav class="bar2">${T('home',I.home,'اليوم')}${T('progress',I.trend,'تقدّمي')}<span class="gap"></span>${T('coach',I.chat,'المساعد')}<button class="tb" onclick="openSettings()">${I.user}<span>الإعدادات</span></button><button class="fab2" onclick="snap()" aria-label="صوّر وجبة">${I.cam}</button></nav>`;
  enter=0;animate();
  if(tab==='coach')scrollTo(0,document.body.scrollHeight);
}
const go=t=>{if(t===tab)return;enter=TB.indexOf(t)>TB.indexOf(tab)?-22:22;tab=t;render()};
function animate(){
  if(anDay!==cur){for(const k in AN)delete AN[k];anDay=cur}
  const C=2*Math.PI*88,rm=RM();
  document.querySelectorAll('[data-a]').forEach(e=>{const k=e.dataset.k,to=+e.dataset.to,a=e.dataset.a,f=rm?to:(AN[k]??0);
    const set=v=>{if(a==='w')e.style.width=v+'%';else if(a==='h')e.style.height=v+'%';else e.style.strokeDasharray=(v*C)+' '+C};
    set(f);e.getBoundingClientRect();set(to);AN[k]=to});
  const n=$('#kc');if(n){const to=+n.dataset.to,f=rm?to:(AN.kc??0);AN.kc=to;if(f===to)n.textContent=fmt(to);else{const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/800),e=1-Math.pow(1-p,3);n.textContent=fmt(Math.round(f+(to-f)*e));if(p<1)requestAnimationFrame(s)})(t0)}}
}
function addWater(d){S.water[cur]=Math.max(0,Math.round(((S.water[cur]||0)+d)*100)/100);save();render()}
function home(){
  const P=S.profile,t=tot(cur),cd=pd(cur),left=P.kcal-t.k,over=left<0,wg=P.wg||2.5,wl=S.water[cur]||0;
  const st=new Date(cd);st.setDate(st.getDate()-((cd.getDay()+1)%7));
  const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const days=[...Array(7)].map((_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);const k=dk(d),p=Math.min(1,tot(k).k/P.kcal),c=2*Math.PI*22;return `<button class="d ${k===cur?'sel':''} ${k>today?'fu':''}" onclick="cur='${k}';render()"><small>${DN[d.getDay()]}</small><span class="dc"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22"/><circle class="pr" cx="26" cy="26" r="22" stroke-dasharray="${p*c} ${c}" style="opacity:${p?1:0}"/></svg><b>${ar(d.getDate())}</b></span></button>`}).join('');
  const mx=(n,v,g,k,c)=>`<div><div class="mh"><span>${n}</span><em>${ar(v)}/${ar(g)}</em></div><div class="tk"><i data-a="w" data-k="${k}" data-to="${Math.min(100,v/g*100)}" style="background:var(${c})"></i></div></div>`;
  const ms=day(cur).slice().sort((a,b)=>b.t-a.t);
  const meals=ms.map(i=>`<div class="meal" onclick="editMeal('${i.id}')"><div class="me">${esc(i.emoji||'🍽️')}</div><div class="mb"><div class="mt"><b>${esc(i.name)}</b><small>${i.t?new Date(i.t).toLocaleTimeString(LOC(),{hour:'numeric',minute:'2-digit'}):''}</small></div><div class="mm"><span class="k"><b>${ar(i.kcal)}</b> سعرة</span><i class="sp"></i><em style="--c:var(--bl)">${ar(i.p)} g</em><em style="--c:var(--ye)">${ar(i.c)} g</em><em style="--c:var(--rd)">${ar(i.f)} g</em></div></div></div>`).join('');
  return `<div class="top2"><div><small>${cd.toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long'})}</small><h1>${cur===today?'اليوم':DN[cd.getDay()]}</h1></div><button class="pill" onclick="openWeight()">${I.scale}<b>${fw(P.w)}</b><small style="color:var(--mu)">${wu()}</small></button></div>
  <div class="wk">${days}</div>
  <div class="card2"><div class="wtr"><small>مياه</small><div class="wrow"><div class="wb"><button onclick="addWater(.25)" aria-label="أضف كوب">+</button><button class="wm" onclick="addWater(-.25)" aria-label="شيل كوب">−</button></div><div class="wbar"><i data-a="h" data-k="w" data-to="${Math.min(100,wl/wg*100)}"></i></div></div><b>${wl.toFixed(1)}</b><em>${wg.toFixed(1)}</em></div>
  <div class="rng"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--tk)" stroke-width="18"/><circle cx="100" cy="100" r="88" fill="none" stroke="${over?'var(--rtx)':'var(--or)'}" stroke-width="18" stroke-linecap="round" data-a="d" data-k="r" data-to="${Math.min(1,t.k/P.kcal)}"/></svg><div class="mid"><b id="kc" data-to="${Math.abs(left)}">${fmt(Math.abs(left))}</b><span>${over?'تجاوزت · سعرة':'متبقي · سعرة'}</span></div></div>
  <div class="mx">${mx('بروتين',t.p,P.p,'p','--bl')}${mx('كارب',t.c,P.c,'c','--ye')}${mx('دهون',t.f,P.f,'f','--rd')}</div></div>
  ${ms.length?meals:`<div class="card2 empty2"><div class="ic">${SI('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.8"/>',30)}</div><h3>صوّر أول وجبة</h3><p>وجّه الكاميرا على صحنك والتطبيق يحسب كل شي لوحده.</p><button class="go" onclick="snap()">${SI('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.8"/>',20)}صوّر الآن</button></div>`}
  <button class="man" onclick="openManual()">${I.edit}تسجيل يدوي</button>`;
}

/* ---------- add / edit meal ---------- */
let txt='',res=null,busy=false,err='',editId=null,img=null,imgUrl='';
const closeS=()=>{const o=$('#layer .ov');if(!o)return;o.classList.add('cl');setTimeout(()=>{if($('#layer .ov')===o)$('#layer').innerHTML=''},230)};
const wrap=h=>{const f=!$('#layer .ov');$('#layer').innerHTML=`<div class="ov ${f?'op':''}" onclick="if(event.target===this)closeS()"><div class="sheet">${h}</div></div>`};
const SYS=`أنت أخصائي تغذية دقيق جدًا. مهمتك تقدير السعرات والماكروز لوجبة المستخدم بأعلى دقة ممكنة ومن غير تخمين عشوائي.
القواعد:
1) حلّل كل مكوّن لوحده (مثلًا: رغيف عيش بلدي، فول، زيت، بيضة) ثم اجمعهم في عنصر واحد للوجبة. لو الوصف فيه وجبات منفصلة تمامًا (زي فطار وعشا) رجّع عنصر لكل وجبة.
2) حوّل كل كمية لجرامات بوزن الأكل وهو جاهز للأكل (مطبوخ لو بيتأكل مطبوخ). لو الكمية مش مذكورة افترض حصة متوسطة واقعية واكتبها في note. لو في صورة قدّر الحصة من حجم الطبق والأدوات الموجودة.
3) استخدم قيم USDA وجداول التغذية المعروفة، وللأكل المصري (رغيف بلدي، فول مدمس، طعمية، كشري، ملوخية، محشي...) استخدم أوزان وقيم الحصص المصرية الشائعة. احسب الزيت والسمن والسكر المستخدم في التقلية والطبخ ولا تهمله.
4) الأرقام لازم تتّسق: kcal تقريبًا = 4×بروتين + 4×كارب + 9×دهون (فرق أقصاه 10%). راجع حسابك قبل الرد.
5) الأرقام للكمية الكاملة اللي المستخدم أكلها مش لكل 100 جم، وكلها أرقام صحيحة بدون كسور.
6) لو النص مش أكل أو مفيهوش معلومات تكفي للتقدير رجّع {"items":[]}.
7) رجّع JSON صالح فقط بدون أي نص تاني بالشكل: {"items":[{"name":"اسم مختصر بالعربي مع الكمية","emoji":"إيموجي واحد","note":"المكونات والأوزان اللي افترضتها بجمل قصيرة","kcal":0,"p":0,"c":0,"f":0}]} حيث p بروتين وc كارب وf دهون بالجرام.`;
function fixAI(o){const x=norm(o),c=Math.round(x.p*4+x.c*4+x.f*9);if(c>0&&(!x.kcal||Math.abs(x.kcal-c)/c>.12))x.kcal=c;x.kcal=Math.min(x.kcal,4000);x.note=String(o.note||'').slice(0,300);return x}

function snap(){$('#cam').click()}
function snapped(i){const f=i.files[0];i.value='';if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{openAdd();img=b;imgUrl=URL.createObjectURL(b);sheet();analyze()},'image/jpeg',.82)};im.src=URL.createObjectURL(f)}
function openAdd(){img=null;imgUrl='';txt='';res=null;busy=false;err='';editId=null;sheet()}
function pick(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{img=b;imgUrl=URL.createObjectURL(b);sheet()},'image/jpeg',.82)};im.src=URL.createObjectURL(f)}

  <button class="go2 ${ok?'':'dim'}" ${busy?'disabled':''} onclick="analyze()">${busy?'بحسب السعرات…':'احسب السعرات'}</button>
  <button class="lnk" onclick="res=[norm({})];sheet()">أدخل الأرقام بنفسي</button>`}`);
}
async function analyze(){
  if(!txt.trim()&&!img){err='اكتب وصف الوجبة أو صوّرها';return sheet()}
  busy=true;err='';sheet();
  const q='أنت خبير تغذية. حلل الوجبة التالية (الأكل غالبًا مصري) وقدّر السعرات والماكروز للكميات المذكورة، ولو الكمية مش مذكورة افترض حصة عادية. لو الوصف وجبة واحدة رجّع عنصر واحد باسم مختصر، ولو أكلات منفصلة تمامًا رجّع عنصر لكل واحدة. رجّع JSON فقط بالشكل {"items":[{"name":"اسم بالعربي","emoji":"إيموجي واحد مناسب","kcal":0,"p":0,"c":0,"f":0}]} حيث p بروتين وc كارب وf دهون بالجرام. وصف المستخدم: '+(txt.trim()||'(الوجبة في الصورة المرفقة)');
  try{const r=await askJSON(SYS+'\n\nوصف المستخدم: '+(txt.trim()||'(الوجبة في الصورة المرفقة، حللها بدقة)'),img);res=(r.items||[]).map(fixAI);if(!res.length)throw 0}
  catch(e){err=e&&e.message==='no-ai'?'الذكاء الاصطناعي مش متاح هنا. افتح الملف على جهازك وأضف مفتاح Groq من الإعدادات، أو استخدم الإدخال اليدوي.':'معرفتش أحسب الوجبة: '+esc((e&&e.message)||'جرّب وصف أوضح')}
  busy=false;sheet();
}
function resHTML(){return `${editId?'':'<p class="mu">راجع التقدير وعدّله لو حابب:</p>'}${res.map((r,i)=>`<div class="sub"><input value="${esc(r.name)}" placeholder="اسم الوجبة" onchange="res[${i}].name=this.value">${r.note?`<p class="mu">📏 ${esc(r.note)}</p>`:''}<div class="g2"><div><label>سعرات</label><input type="number" value="${r.kcal}" onchange="res[${i}].kcal=+this.value"></div><div><label>بروتين (جم)</label><input type="number" value="${r.p}" onchange="res[${i}].p=+this.value"></div><div><label>كارب (جم)</label><input type="number" value="${r.c}" onchange="res[${i}].c=+this.value"></div><div><label>دهون (جم)</label><input type="number" value="${r.f}" onchange="res[${i}].f=+this.value"></div></div></div>`).join('')}
  <div class="g2">${editId?`<button class="btn red" onclick="delMeal()">حذف</button><button class="btn" onclick="saveMeal()">حفظ</button>`:`<button class="btn sec" onclick="res=null;sheet()">رجوع</button><button class="btn" onclick="addItems()">✓ أضف</button>`}</div>`}

/* ---------- progress ---------- */
function progress(){
  const P=S.profile,ds=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d}),vs=ds.map(d=>tot(dk(d)).k);
  const mx=Math.max(P.kcal*1.2,...vs),avg=Math.round(vs.reduce((a,b)=>a+b,0)/7),ly=150-P.kcal/mx*130;
  const bars=ds.map((d,i)=>{const h=vs[i]/mx*130;return `<rect x="${i*44+12}" y="${150-h}" width="26" height="${h}" rx="8" fill="${vs[i]>P.kcal?'var(--rd)':'var(--or)'}"/><text x="${i*44+25}" y="168" font-size="12" text-anchor="middle" fill="var(--mu)">${L[d.getDay()]}</text>`}).join('');
  return `<div class="top"><h1>التقدم</h1><span class="cb" style="padding:0 14px">🔥 ${ar(streak())} يوم</span></div>
  <div class="card"><div class="mt"><b>آخر ٧ أيام</b><small>المتوسط ${ar(avg)} سعر</small></div>
  <svg viewBox="0 0 320 175" width="100%"><line x1="0" x2="320" y1="${ly}" y2="${ly}" stroke="var(--mu)" stroke-dasharray="4 4"/>${bars}</svg></div>
  <div class="card"><b>متوسط الماكروز اليومي (٧ أيام)</b><p class="mu">${(()=>{const s=ds.map(d=>tot(dk(d)));const a=k=>Math.round(s.reduce((x,y)=>x+y[k],0)/7);return `بروتين ${ar(a('p'))}g · كارب ${ar(a('c'))}g · دهون ${ar(a('f'))}g`})()}</p></div>`;
}

async function ask(q){
  const i=$('#ci');q=q||(i&&i.value.trim());if(!q)return;
  chat.push({role:'user',content:q},{role:'assistant',content:'…'});render();
  const P=S.profile,t=tot(today);
  const ctx=`أنت مدرب تغذية ودود بتتكلم مصري. هدف المستخدم اليومي ${P.kcal} سعر (بروتين ${P.p}جم، كارب ${P.c}جم، دهون ${P.f}جم). أكل النهارده لحد دلوقتي: ${t.k} سعر، بروتين ${t.p}، كارب ${t.c}، دهون ${t.f}. الوجبات: ${day(today).map(x=>x.name).join('، ')||'لسه مفيش'}. جاوب باختصار وبشكل عملي.`;
  const m=chat.slice(0,-1).slice(-7).map(x=>({...x}));m[m.length-1].content=ctx+'\n\nالسؤال: '+q;
  const on=t=>{chat[chat.length-1].content=t;const e=document.querySelectorAll('.msg.a');if(e.length)e[e.length-1].textContent=t};
  try{await askChat(m,on)}catch(e){chat[chat.length-1].content=e.message==='no-ai'?'المساعد مش متاح. ضيف مفتاح Groq من الإعدادات.':'حصل خطأ، جرب تاني.'}
  render();
}

    <div class="mcs"><span>${dot('var(--bl)')}بروتين ${ar(P.p)}g</span><span>${dot('var(--ye)')}كارب ${ar(P.c)}g</span><span>${dot('var(--rd)')}دهون ${ar(P.f)}g</span></div>
    <button class="stb" onclick="goSet('goals')">عدّل أهدافك</button></div>
    <div class="sts">عام</div>
    <div class="stg">
     ${row(IC.goal,'الأهداف اليومية',ar(P.kcal)+' سعر',"goSet('goals')")}
     ${row(IC.body,'قياسات الجسم',fw(P.w)+' '+wu(),"goSet('body')")}
     ${selRow(IC.unit,'وحدة الوزن','unit',S.unit,"setUnit(this.value)")}
     ${row(IC.store,'التخزين','',"goSet('data')")}
    </div>
    <div class="sts">المظهر</div>
    <div class="seg" style="--i:${['auto','dark','light'].indexOf(S.mode)}"><i></i>${[['auto','⚙️ تلقائي'],['dark','🌙 داكن'],['light','☀️ فاتح']].map(m=>`<button class="${S.mode===m[0]?'on':''}" onclick="setMode('${m[0]}')">${m[1]}</button>`).join('')}</div>
    <div class="stg" style="margin-top:12px">${row(IC.theme,'لون التطبيق',themeName(),"goSet('theme')")}</div>
    <div class="sts">الذكاء الاصطناعي</div>
    <div class="stg">${row(IC.ai,'مفتاح Groq والموديل',S.key?'مفعّل':'غير مضاف',"goSet('ai')")}</div>
    <div class="sts">الإضافات</div>
    <div class="stg"><button class="rw" onclick="togNum(this)"><span class="ri">${IC.num}</span><span class="rl">الأرقام العربية</span><span class="sw ${S.ard?'on':''}"><i></i></span></button></div>
    <p class="stn">لو شغّلتها الأرقام هتظهر بالشكل ده ٠١٢٣ بدل 0123.</p>`];
}
function drawSettings(f){
  const[t,h]=stBody();
  $('#set').innerHTML=`<div class="stp ${f?'op':''}"><div class="sth">${SP==='main'?'<span></span>':`<button class="stc" onclick="goSet('main')" aria-label="رجوع">${IC.back}</button>`}<h1>${t}</h1><button class="stc" onclick="closeSettings()" aria-label="إغلاق">${IC.x}</button></div><div class="stin ${f?'':'in'}" style="--dx:${SP==='main'?22:-22}px">${h}</div></div>`;
  document.body.style.overflow='hidden';
}
function openSettings(p){SP=p||'main';drawSettings(true)}
const goSet=p=>{SP=p;drawSettings(false)};
function closeSettings(){const p=$('#set .stp'),f=()=>{$('#set').innerHTML='';document.body.style.overflow='';render()};if(p&&!RM()){p.classList.add('out');setTimeout(f,280)}else f()}
function setP(k,v){v=+v;if(!isFinite(v)||v<=0)return toast('رقم مش صحيح');if(k==='w')v=Math.round(v*100)/100;S.profile[k]=v;save()}
function setSel(k,v){S.profile[k]=k==='sex'?v:+v;save();const e=$('#v_'+k);if(e)e.firstChild.nodeValue=lab(k,v)}
function setUnit(v){S.unit=v;save();const e=$('#v_unit');if(e)e.firstChild.nodeValue=lab('unit',v);goSet('main')}
function togNum(b){S.ard=!S.ard;save();b.querySelector('.sw').classList.toggle('on',!!S.ard)}
function setMode(m){S.mode=m;save();applyTheme();const g=$('.seg');g.style.setProperty('--i',['auto','dark','light'].indexOf(m));g.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===['auto','dark','light'].indexOf(m)))}
function setTheme(id){S.accent=id;save();applyTheme();document.querySelectorAll('.tc').forEach(e=>e.classList.toggle('sel',e.dataset.id===id))}
function calc(){
  const P=S.profile,w=P.w,bmr=10*w+6.25*P.h-5*P.age+(P.sex==='m'?5:-161),k=Math.max(1200,Math.round(bmr*P.act+P.goal));
  const p=Math.round(w*1.8),f=Math.round(k*.27/9),c=Math.max(0,Math.round((k-p*4-f*9)/4));
  Object.assign(P,{kcal:k,p,c,f});save();toast('اتحسبت الأهداف ✓');goSet('goals');
}
function expData(){
  const o={...S};delete o.key;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='sa3rati-'+today+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('اتصدّرت النسخة ✓');
}
async function impData(i){
  const f=i.files[0];if(!f)return;
  try{
    const o=JSON.parse(await f.text());if(!o||typeof o.logs!=='object'||!o.profile)throw 0;
    if(!confirm('هيتم استبدال بياناتك الحالية بالنسخة دي. متأكد؟')){i.value='';return}
    const k=S.key;S=Object.assign({logs:{},weights:[]},o,{key:k});S.model=S.model||'auto';S.theme=S.theme||'auto';S.unit=S.unit||'kg';
    save();applyTheme();toast('اتستوردت النسخة ✓');goSet('data');
  }catch(e){toast('الملف مش نسخة صالحة')}
  i.value='';
}
function wipe(){if(confirm('مسح كل البيانات؟')){S={};localStorage.removeItem(K);location.reload()}}
(function(){let y0=0,sh=null;const L=$('#layer');
L.addEventListener('touchstart',e=>{if(e.target.classList.contains('hnd')){sh=e.target.closest('.sheet');y0=e.touches[0].clientY;sh.style.transition='none'}},{passive:true});
L.addEventListener('touchmove',e=>{if(sh)sh.style.transform='translateY('+Math.max(0,e.touches[0].clientY-y0)+'px)'},{passive:true});
L.addEventListener('touchend',e=>{if(!sh)return;const d=e.changedTouches[0].clientY-y0;sh.style.transition='transform .25s';if(d>110)closeS();else sh.style.transform='';sh=null})})();
render();
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
